name: Build Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # permite lanzarlo manualmente desde la UI de Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Derivar version del tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compilar instalador
        env:
          PATCH_VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build.sh

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*.exe
          generate_release_notes: true

      - name: Subir artefacto (para runs manuales)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: FFFADF-ES-Patch
          path: build/dist/*.exe
